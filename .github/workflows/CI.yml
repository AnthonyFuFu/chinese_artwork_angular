name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build Angular site
        run: npm run build -- --output-mode=static --base-href=/chinese_artwork_angular/

      - name: Prepare and check site
        run: |
          set -eux

          SITE_DIR="dist/chinese_artwork/browser"

          # 列出建置產物，方便確認 Angular 實際輸出的路徑
          find "$SITE_DIR" -maxdepth 3 -type f | sort

          # 根路徑首頁應輸出在這裡
          test -f "$SITE_DIR/index.html"

          # 提供 GitHub Pages 的路由 fallback
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"

          # 顯示部署資料夾大小
          du -sh "$SITE_DIR"
          du -sb "$SITE_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/chinese_artwork/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
