name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # 對齊 package.json 宣告的 npm 版本
      - name: Setup npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build Angular site
        run: npm run build -- --output-mode=static --base-href=/chinese_artwork_angular/

      # GitHub Pages 的 404.html 可協助 Angular Router 處理直接進入子路由
      - name: Prepare site for GitHub Pages
        run: |
          test -d dist/chinese_artwork/browser
          if [ -f dist/chinese_artwork/browser/index.csr.html ]; then
            cp dist/chinese_artwork/browser/index.csr.html dist/chinese_artwork/browser/404.html
          elif [ -f dist/chinese_artwork/browser/index.html ]; then
            cp dist/chinese_artwork/browser/index.html dist/chinese_artwork/browser/404.html
          fi
          ls -la dist/chinese_artwork/browser

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/chinese_artwork/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5