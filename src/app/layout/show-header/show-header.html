<header class="show-header">
    <div class="glass-container">
        <div class="header-content">
            <div class="logo-area">
                <a routerLink="/">
                    <span class="logo-text">藝術殿堂</span>
                </a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">首頁</a></li>
                    <li><a routerLink="/artist" routerLinkActive="active" class="nav-link">藝術家</a></li>
                    <li><a routerLink="/artwork" routerLinkActive="active" class="nav-link">藝術品</a></li>
                    <li><a routerLink="/dictionary" routerLinkActive="active" class="nav-link">藝術詞典</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" placeholder="搜尋藝術品或藝術家..." />
                    <mat-icon>search</mat-icon>
                </div>
            </div>
        </div>
    </div>
</header>
